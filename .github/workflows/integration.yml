name: Testes de integração

on:
  push:
    branches: [main]
  pull_request:

jobs:
  integration:
    name: Repositório × PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15.7
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tc1_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Testes de integração
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tc1_it?sslmode=disable
        run: go test -tags integration -count=1 -v ./internal/infra/repository/
