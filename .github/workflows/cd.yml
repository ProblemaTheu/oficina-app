name: CD

# Build → Docker Hub → EKS. Dispara em push na `main` (ou tag v*) e sob
# demanda; `homolog` é só integração (o ambiente de homologação foi
# dispensado — corte 10 da Fase 3), então não implanta.
#
# Autenticação na AWS por OIDC, sem segredo de longa duração. A trust policy
# da role (oficina-infra-k8s/bootstrap) só aceita `main` ou `environment: prod`
# — o `environment` no job de deploy é o que faz o disparo manual a partir
# de outra branch funcionar, e é onde o reviewer obrigatório será ligado
# quando houver permissão de admin no repositório.
#
# A role só pode descrever o cluster e ler parâmetros; dentro do cluster ela
# tem Edit restrito ao namespace `oficina-prod` (access entry no Terraform do
# infra-k8s). Um pipeline comprometido não apaga o cluster.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGEM: docker.io/problematheu/oficina-api
  NAMESPACE: oficina-prod

jobs:
  # ─────────────────────────────────────────────
  # F2-6.2 — Build + push da imagem no Docker Hub
  # ─────────────────────────────────────────────
  build-and-push:
    name: Build e push da imagem
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Definir tags da imagem
        id: meta
        run: echo "sha_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login no Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build e push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # linux/arm64 é opcional: exige docker/setup-qemu-action e
          # aumenta bastante o tempo de build (emulação via QEMU).
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGEM }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.IMAGEM }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job Summary
        run: |
          {
            echo "# 🐳 CD — Build e push da imagem"
            echo
            echo "Publicada em \`${IMAGEM}\`:"
            echo "- \`${{ steps.meta.outputs.sha_tag }}\`"
            echo "- \`latest\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────
  # F3-1.5 — Deploy no EKS
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy no EKS
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write # OIDC
    env:
      TAG: ${{ needs.build-and-push.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # O nome do cluster é publicado pelo infra-k8s na SSM: este repositório
      # não precisa saber nada da infraestrutura além do path.
      - name: Kubeconfig
        run: |
          CLUSTER=$(aws ssm get-parameter --name /oficina/shared/eks/cluster_name \
            --query Parameter.Value --output text)
          aws eks update-kubeconfig --name "$CLUSTER" --region "${{ vars.AWS_REGION }}"

      - name: Instalar kustomize
        run: |
          if ! command -v kustomize >/dev/null; then
            curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz" \
              | sudo tar -xz -C /usr/local/bin kustomize
          fi
          kustomize version

      # A tag entra no overlay ANTES do apply: um rollout só, com a imagem
      # certa — não um com `latest` seguido de outro com o SHA.
      - name: Aplicar manifestos (overlay prod)
        id: apply
        working-directory: k8s/overlays/prod
        run: |
          kustomize edit set image "${IMAGEM}=${IMAGEM}:${TAG}"
          kustomize build . | grep -E 'image:' # visível no log
          kubectl apply -k .

      - name: Aguardar rollout
        id: rollout
        run: kubectl -n "$NAMESPACE" rollout status deployment/api --timeout=300s

      # Rollout que não converge (imagem quebrada, probe falhando) volta para a
      # revisão anterior sozinho — sem deixar o ambiente pela metade. Só depois
      # do apply: falha antes disso não mexeu em nada, e desfazer reverteria
      # um deploy saudável.
      - name: Rollback em caso de falha
        if: failure() && (steps.apply.outcome == 'failure' || steps.rollout.outcome == 'failure')
        run: |
          kubectl -n "$NAMESPACE" rollout undo deployment/api
          kubectl -n "$NAMESPACE" rollout status deployment/api --timeout=180s

      # Marcador de deploy no New Relic — a linha vertical no gráfico que
      # responde "a latência subiu depois de qual deploy?". Opcional: só roda
      # se o ID da aplicação APM estiver configurado como variable.
      - name: Registrar deploy no New Relic
        if: success() && vars.NEW_RELIC_APP_ID != ''
        run: |
          curl -sS -o /dev/null -w 'New Relic: HTTP %{http_code}\n' -X POST \
            "https://api.newrelic.com/v2/applications/${{ vars.NEW_RELIC_APP_ID }}/deployments.json" \
            -H "Api-Key: ${{ secrets.NEW_RELIC_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"deployment\":{\"revision\":\"${TAG}\",\"user\":\"${{ github.actor }}\",\"changelog\":\"${{ github.ref_name }}\"}}"

      - name: Job Summary
        if: always()
        run: |
          {
            echo "# 🚀 CD — Deploy no EKS"
            echo
            if [ "${{ job.status }}" = "success" ]; then
              echo "Imagem \`${TAG}\` implantada em \`${NAMESPACE}/api\` (ref \`${{ github.ref_name }}\`)."
            else
              echo "**Deploy falhou** — rollback para a revisão anterior executado. Ver o log acima."
            fi
            echo
            echo "> Migrations rodam no boot da aplicação (advisory lock do Postgres via golang-migrate — ver k8s/README.md)."
          } >> "$GITHUB_STEP_SUMMARY"
