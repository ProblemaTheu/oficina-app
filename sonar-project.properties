sonar.sources=.
# api.gen.go é gerado pelo oapi-codegen — fora da análise (smells, duplicação e cobertura)
sonar.exclusions=**/*_test.go,**/vendor/**,**/docs/**,**/api.gen.go
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.go.coverage.reportPaths=coverage.out

# Fora do cálculo de cobertura (seguem analisados para bugs/smells):
# - internal/infra/repository: testado por integração contra PostgreSQL real
#   (workflow integration.yml, relatório integration-coverage.out) — o Sonar
#   só recebe o perfil unitário, então apareceria como 0% indevidamente.
# - cmd e scripts: bootstrap da aplicação (main conecta banco e sobe servidor).
# - internal/infra/database: conexão e migrator exigem banco real.
sonar.coverage.exclusions=internal/infra/repository/**,cmd/**,scripts/**,internal/infra/database/**
