# Identidade AWS do pod por EKS Pod Identity (Fase 4): a associação
# (namespace oficina-prod + service account api → role oficina-os-pod) está
# em infra/servico/pod.tf e dá acesso às filas da saga. Nenhuma chave AWS no
# cluster. No ambiente local (kind) não há associação — o compose da saga é
# que fala com o LocalStack.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: tech-challenge
