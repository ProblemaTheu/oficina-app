# Overlay de produção — EKS + RDS na AWS.
#
# Diferenças em relação ao local:
#   - sem Postgres in-cluster: DB_HOST aponta para o RDS
#   - sem Mailpit: NOTIFIER=log (corte 5 — SES ficou fora do escopo, e a
#     integração SMTP é demonstrada no ambiente local)
#   - Service type LoadBalancer (NLB): corte 1, sem VPC Link nem ALB interno
#
# O Secret oficina-secrets NÃO é versionado: criado a partir do Secrets
# Manager por scripts/prod-secret.sh.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: oficina-prod

resources:
  - ../../base

images:
  - name: docker.io/problematheu/oficina-api
    newTag: latest

patches:
  # O namespace é criado pelo Terraform do oficina-infra-k8s, que é o dono
  # dele. Aplicá-lo daqui também colocaria dois donos no mesmo recurso.
  - target:
      kind: Namespace
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: oficina

  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: oficina-config
      data:
        DB_HOST: oficina-prod.c6v88i2ao3cy.us-east-1.rds.amazonaws.com
        DB_PORT: "5432"
        DB_NAME: oficina
        # O RDS recusa conexão sem TLS (rds.force_ssl=1). "require" cifra o
        # tráfego sem exigir o bundle de CA da AWS no container; verify-full
        # seria o passo seguinte, e depende de montar o certificado.
        DB_SSLMODE: require
        NOTIFIER: log

  # Expõe a API pela borda — Classic Load Balancer, de propósito.
  #
  # ⚠️ NÃO acrescente `aws-load-balancer-type: nlb`. Esta conta AWS responde
  # OperationNotPermitted na API ELBv2 ("This AWS account currently does not
  # support creating load balancers"), restrição de conta nova que também
  # vale para ALB. A API clássica não é afetada, então o Service sem
  # anotação de tipo sobe um CLB e funciona. Custa US$ 0,025/h contra
  # US$ 0,0225/h do NLB — US$ 0,05 a mais por dia.
  #
  # O corte 1 (API Gateway com HTTP_PROXY) não muda: o Gateway aponta para o
  # DNS público do balanceador, seja ele CLB ou NLB.
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: api
        annotations:
          service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
      spec:
        type: LoadBalancer
