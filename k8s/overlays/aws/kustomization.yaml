# Overlay AWS (EKS + RDS) — preparado para o futuro (ver F2-5.3).
# Diferenças em relação ao local:
#   - sem Postgres in-cluster (DB_HOST aponta para o endpoint do RDS)
#   - sem Mailpit (usar provedor SMTP real via Secret)
#   - imagem vinda do Docker Hub (tag definida pelo CI/CD)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: oficina-prod

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: oficina-config
      data:
        DB_HOST: oficina-prod.c6v88i2ao3cy.us-east-1.rds.amazonaws.com
        DB_NAME: oficina
        DB_PORT: "5432"
        DB_SSLMODE: require
        NOTIFIER: log
        SMTP_HOST: mailpit
        SMTP_PORT: "1025"
        NEW_RELIC_APP_NAME: oficina-api-prod
        LOG_LEVEL: info
