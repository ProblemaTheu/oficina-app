version: "2"

linters:
  # Conjunto padrão: errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - revive
  settings:
    revive:
      rules:
        # Não exigir doc comment em todo símbolo exportado
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    rules:
      # api.gen.go é gerado pelo oapi-codegen — não lintar estilo
      - path: internal/infra/http/api/api\.gen\.go
        linters:
          - revive
          - staticcheck

formatters:
  enable:
    - gofmt
