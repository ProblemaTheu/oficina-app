# Execution Service no cluster local — k8s/base do oficina-execution (pasta
# irmã), namespace execution-prod, porta 8082. DynamoDB no LocalStack.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: execution-prod
resources:
  - ../../../../oficina-execution/k8s/base
images:
  - name: docker.io/problematheu/oficina-execution
    newName: oficina-execution
    newTag: local
configMapGenerator:
  - name: execution-ambiente
    literals:
      - DYNAMODB_TABELA=execution-tarefas
      - FILA_EXECUTION_URL=http://localstack.infra:4566/000000000000/execution-commands.fifo
      - FILA_RESPOSTAS_URL=http://localstack.infra:4566/000000000000/os-saga-replies.fifo
      - AWS_ENDPOINT_URL=http://localstack.infra:4566
patches:
  - target: { kind: Deployment, name: execution }
    patch: |-
      - { op: add, path: /spec/template/spec/containers/0/imagePullPolicy, value: Never }
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: execution-config
      data:
        # Gatilho da cena de falha do vídeo (placas FAL*).
        PERMITIR_FALHA_SIMULADA: "true"
        NEW_RELIC_APP_NAME: oficina-execution-local
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: execution
      spec:
        type: NodePort
        ports:
          - { name: http, port: 80, targetPort: http, nodePort: 30082 }
