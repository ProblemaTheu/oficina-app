# Stub da API de Orders do Mercado Pago (cmd/mp-stub do oficina-billing, na
# mesma imagem). Para a demo com o sandbox REAL, aponte MP_BASE_URL do
# Billing para https://api.mercadopago.com (local/subir.sh, MP_REAL=1).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp-stub
  labels: { app.kubernetes.io/name: mp-stub, app.kubernetes.io/part-of: oficina }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: mp-stub } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mp-stub, app.kubernetes.io/part-of: oficina }
    spec:
      # Nenhum destes pods fala com a API do Kubernetes.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mp-stub
          image: oficina-billing:local
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          imagePullPolicy: Never
          command: ["./mp-stub"]
          ports: [{ name: http, containerPort: 8090 }]
          env:
            - { name: PORTA, value: "8090" }
            - { name: BILLING_WEBHOOK_URL, value: "http://billing.billing-prod/billing/webhooks/mercadopago" }
            # O checkout_url devolvido é aberto no navegador do host.
            - { name: STUB_URL_PUBLICA, value: "http://localhost:8090" }
          envFrom: [{ secretRef: { name: mp-stub } }]
          resources:
            requests: { cpu: 20m, memory: 32Mi, ephemeral-storage: 64Mi }
            limits: { cpu: 500m, memory: 128Mi, ephemeral-storage: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: mp-stub
  labels: { app.kubernetes.io/name: mp-stub, app.kubernetes.io/part-of: oficina }
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: mp-stub }
  ports: [{ name: http, port: 8090, targetPort: http, nodePort: 30090 }]
