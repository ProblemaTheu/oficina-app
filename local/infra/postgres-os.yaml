# PostgreSQL próprio do OS Service (equivalente local do RDS).
# emptyDir: ambiente de demonstração, recriado do zero pelo local/subir.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-os
  labels: { app.kubernetes.io/name: postgres-os, app.kubernetes.io/part-of: oficina }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: postgres-os } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres-os, app.kubernetes.io/part-of: oficina }
    spec:
      # Nenhum destes pods fala com a API do Kubernetes.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:15.7
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          ports: [{ name: pg, containerPort: 5432 }]
          envFrom: [{ secretRef: { name: postgres-os } }]
          env:
            # Sem root: o initdb cria o subdiretório com o dono certo (UID 999) dentro do emptyDir.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\""] }
            periodSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 96Mi, ephemeral-storage: 64Mi }
            limits: { cpu: 500m, memory: 384Mi, ephemeral-storage: 512Mi }
          # Root filesystem somente leitura: graváveis só os dados, o socket e /tmp.
          volumeMounts:
            - { name: dados, mountPath: /var/lib/postgresql/data }
            - { name: socket, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: dados, emptyDir: {} }
        - { name: socket, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-os
  labels: { app.kubernetes.io/name: postgres-os, app.kubernetes.io/part-of: oficina }
spec:
  selector: { app.kubernetes.io/name: postgres-os }
  ports: [{ name: pg, port: 5432, targetPort: pg }]
